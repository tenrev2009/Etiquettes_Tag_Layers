<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CSV Tag Renamer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: #2b2b2b;
    background: #f4f5f7;
    padding: 16px;
  }

  h1 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  p.subtitle {
    color: #6b7280;
    margin-bottom: 16px;
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }

  button {
    display: block;
    width: 100%;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: #ffffff;
    transition: filter 0.15s ease;
  }
  button:hover  { filter: brightness(1.08); }
  button:active { filter: brightness(0.92); }

  #btn-export { background: #1d6fb8; }
  #btn-import { background: #2e8b57; }

  .console-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #6b7280;
    margin-bottom: 4px;
  }

  #console {
    background: #ffffff;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    min-height: 110px;
    max-height: 160px;
    overflow-y: auto;
    padding: 8px 10px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px;
    line-height: 1.5;
  }

  #console .msg-info    { color: #374151; }
  #console .msg-success { color: #15803d; }
  #console .msg-error   { color: #b91c1c; }
  #console .msg-empty   { color: #9ca3af; font-style: italic; }
</style>
</head>
<body>

  <h1>CSV Tag Renamer</h1>
  <p class="subtitle">Renommage en masse des balises et dossiers de balises via CSV.</p>

  <div class="actions">
    <button id="btn-export" type="button" onclick="exportCSV();">
      Exporter la structure (CSV)
    </button>
    <button id="btn-import" type="button" onclick="importCSV();">
      Importer les modifications (CSV)
    </button>
  </div>

  <div class="console-label">Messages</div>
  <div id="console">
    <div class="msg-empty">En attente d&rsquo;une action&hellip;</div>
  </div>

<script>
  var consoleCleared = false;

  function exportCSV() {
    sketchup.export_csv();
  }

  function importCSV() {
    sketchup.import_csv();
  }

  // Appelée depuis Ruby via dialog.execute_script.
  // kind : 'info' | 'success' | 'error'
  function appendConsole(message, kind) {
    var box = document.getElementById('console');
    if (!consoleCleared) {
      box.innerHTML = '';
      consoleCleared = true;
    }
    var line = document.createElement('div');
    line.className = 'msg-' + (kind || 'info');
    line.textContent = message;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }
</script>
</body>
</html>
